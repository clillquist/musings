title: Musings
tagline: Notes & thoughts
description: >-
  Half-finished thoughts and photography.
author: Chad
url: "https://clillquist.github.io"
baseurl: "/musings"

permalink: /:year/:month/:title/
timezone: America/Denver

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: drafts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .tool-versions
  - vendor
